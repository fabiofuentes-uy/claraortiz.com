<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>clara ortiz</title>

  <style>
    :root{
      --fondo:#eae0d6;
      --tinta:#5f4638;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,body{
      width:100%;
      min-height:100%;
      background:var(--fondo);
    }

    body{
      overflow-x:hidden;
      font-family:Arial, Helvetica, sans-serif;
    }

    .pagina{
      position:relative;
      width:100vw;
      min-height:100vh;
      background:var(--fondo);
      display:flex;
      align-items:flex-start;
      justify-content:center;
      overflow:hidden;
    }

    .imagen{
      display:block;
      width:100vw;
      height:auto;
      min-height:100vh;
      object-fit:contain;
      object-position:top center;
      background:var(--fondo);
      user-select:none;
      -webkit-user-drag:none;
    }

    /* Enlaces invisibles sobre la navegación que ya está dibujada en estetica.jpg */
    .nav-desktop{
      position:absolute;
      inset:0;
      z-index:10;
      pointer-events:none;
    }

    .nav-desktop a{
      position:absolute;
      top:4.2%;
      height:5.2%;
      pointer-events:auto;
      text-indent:-9999px;
      overflow:hidden;
      border-radius:4px;
    }

    .nav-desktop .concepto{
      left:70.0%;
      width:8.7%;
    }

    .nav-desktop .estetica{
      left:79.0%;
      width:7.8%;
      cursor:default;
    }

    .nav-desktop .contacto{
      left:87.4%;
      width:8.8%;
    }

    /* Mobile */
    .hamburger{
      display:none;
      position:absolute;
      z-index:30;
      top:2.25%;
      right:5.0%;
      width:11%;
      aspect-ratio:1 / 1;
      border:0;
      background:transparent;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .menu-mobile{
      display:none;
      position:fixed;
      inset:0;
      z-index:50;
      background:rgba(234,224,214,.985);
      align-items:center;
      justify-content:center;
    }

    .menu-mobile.abierto{
      display:flex;
    }

    .menu-contenido{
      width:min(78vw,420px);
      text-align:center;
      color:var(--tinta);
    }

    .cerrar{
      position:absolute;
      top:26px;
      right:29px;
      width:46px;
      height:46px;
      border:0;
      background:transparent;
      color:var(--tinta);
      font-size:38px;
      line-height:1;
      cursor:pointer;
      font-weight:200;
    }

    .menu-contenido a{
      display:block;
      padding:18px 8px;
      color:var(--tinta);
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing:.24em;
      font-size:15px;
      border-bottom:1px solid rgba(95,70,56,.24);
    }

    .menu-contenido a:last-child{
      border-bottom:0;
    }

    @media (max-width: 767px){
      .pagina{
        min-height:auto;
        align-items:flex-start;
      }

      .imagen{
        width:100%;
        min-height:0;
        height:auto;
        object-fit:contain;
      }

      .nav-desktop{
        display:none;
      }

      .hamburger{
        display:block;
      }
    }

    @media (min-width:768px){
      .menu-mobile,
      .hamburger{
        display:none !important;
      }
    }
  </style>
</head>

<body>
  <main class="pagina">
    <picture>
      <source media="(max-width: 767px)" srcset="estetica-mobile.jpg">
      <img
        class="imagen"
        src="estetica.jpg"
        alt="Estética — Clara Ortiz, Punta del Este"
        draggable="false"
      >
    </picture>

    <nav class="nav-desktop" aria-label="Navegación principal">
      <a class="concepto" href="concepto.html" aria-label="Concepto">Concepto</a>
      <a class="estetica" href="estetica.html" aria-current="page" aria-label="Estética">Estética</a>
      <a class="contacto" href="contacto.html" aria-label="Contacto">Contacto</a>
    </nav>

    <button
      class="hamburger"
      id="abrirMenu"
      aria-label="Abrir menú"
      aria-controls="menuMobile"
      aria-expanded="false">
    </button>
  </main>

  <div class="menu-mobile" id="menuMobile" aria-hidden="true">
    <button class="cerrar" id="cerrarMenu" aria-label="Cerrar menú">×</button>

    <nav class="menu-contenido" aria-label="Navegación móvil">
      <a href="index.html">Inicio</a>
      <a href="concepto.html">Concepto</a>
      <a href="estetica.html" aria-current="page">Estética</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </div>

  <script>
    const abrir = document.getElementById('abrirMenu');
    const cerrar = document.getElementById('cerrarMenu');
    const menu = document.getElementById('menuMobile');

    function abrirMenu(){
      menu.classList.add('abierto');
      menu.setAttribute('aria-hidden','false');
      abrir.setAttribute('aria-expanded','true');
      document.body.style.overflow='hidden';
    }

    function cerrarMenu(){
      menu.classList.remove('abierto');
      menu.setAttribute('aria-hidden','true');
      abrir.setAttribute('aria-expanded','false');
      document.body.style.overflow='';
    }

    abrir.addEventListener('click', abrirMenu);
    cerrar.addEventListener('click', cerrarMenu);

    menu.addEventListener('click', (e)=>{
      if(e.target === menu) cerrarMenu();
    });

    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape') cerrarMenu();
    });
  </script>
</body>
</html>
