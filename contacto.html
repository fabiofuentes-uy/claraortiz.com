<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Clara Ortiz</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      background: #ccc0b4;
    }


    body {
      overflow: hidden;
    }


    .page {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: #ccc0b4;
    }


    .page-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }


    .hit {
      fill: transparent;
      pointer-events: all;
      cursor: pointer;
    }


    .menu-underline {
      stroke: #6e5139;
      stroke-width: 1.4;
      vector-effect: non-scaling-stroke;
      opacity: 0;
      transition: opacity .18s ease;
      pointer-events: none;
    }


    .menu-link:hover .menu-underline,
    .menu-link:focus .menu-underline {
      opacity: 1;
    }


    .focus-outline {
      fill: none;
      stroke: #6e5139;
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
      opacity: 0;
      pointer-events: none;
    }


    .menu-link:focus-visible .focus-outline,
    .home-link:focus-visible .focus-outline {
      opacity: .75;
    }


    a {
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }


    /* ==================================================
       VERSIONES DESKTOP / MOBILE
    ================================================== */

    .desktop-svg { display: block; }
    .mobile-svg { display: none; }
    .mobile-menu { display: none; }

    @media (max-width: 700px) {
      html, body, .page {
        background: #ebe1d8;
      }

      .desktop-svg { display: none; }
      .mobile-svg { display: block; }

      .mobile-menu {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(235, 225, 216, .985);
      }

      .mobile-menu.open {
        display: flex;
      }

      .mobile-menu-inner {
        width: min(76vw, 360px);
        text-align: center;
      }

      .mobile-menu-close {
        position: absolute;
        top: 24px;
        right: 27px;
        border: 0;
        background: transparent;
        color: #6e5139;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 36px;
        font-weight: 300;
        line-height: 1;
        cursor: pointer;
      }

      .mobile-menu a {
        display: block;
        padding: 18px 0;
        border-bottom: 1px solid rgba(110, 81, 57, .22);
        color: #4f3c2e;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13px;
        letter-spacing: .22em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .mobile-menu a:first-of-type {
        border-top: 1px solid rgba(110, 81, 57, .22);
      }
    }

  </style>

</head>


<body>


  <main class="page">


    <!-- ==================================================
         MOBILE — usa contacto-mobile.jpg sin modificarla
    ================================================== -->

    <svg
      class="page-svg mobile-svg"
      viewBox="0 0 941 1672"
      preserveAspectRatio="xMidYMid meet"
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      aria-label="Contacto — Clara Ortiz — versión móvil"
    >

      <image
        href="./contacto-mobile.jpg"
        xlink:href="./contacto-mobile.jpg"
        x="0"
        y="0"
        width="941"
        height="1672"
        preserveAspectRatio="none"
      />

      <!-- Logo -->
      <a href="./index.html" xlink:href="./index.html" aria-label="Volver al inicio">
        <rect class="hit" x="220" y="20" width="520" height="125" rx="4" />
      </a>

      <!-- Hamburguesa -->
      <a id="mobileMenuButton" href="#menu" xlink:href="#menu" aria-label="Abrir menú">
        <rect class="hit" x="785" y="25" width="130" height="120" rx="4" />
      </a>


      <!-- Instagram -->
      <a
        href="https://www.instagram.com/claraortiz.uy/"
        xlink:href="https://www.instagram.com/claraortiz.uy/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram de Clara Ortiz"
      >
        <rect class="hit" x="120" y="1280" width="700" height="105" rx="8" />
      </a>

      <!-- Email -->
      <a
        href="mailto:soyclaraortiz@gmail.com"
        xlink:href="mailto:soyclaraortiz@gmail.com"
        aria-label="Enviar correo a Clara Ortiz"
      >
        <rect class="hit" x="120" y="1395" width="700" height="105" rx="8" />
      </a>

    </svg>


    <svg
      class="page-svg desktop-svg"
      viewBox="0 0 1670 941"
      preserveAspectRatio="xMidYMid meet"
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      aria-label="Contacto — Clara Ortiz"
    >


      <image
        href="./contacto.jpg"
        xlink:href="./contacto.jpg"
        x="0"
        y="0"
        width="1670"
        height="941"
        preserveAspectRatio="none"
      />


      <a
        class="home-link"
        href="./index.html"
        xlink:href="./index.html"
        aria-label="Volver al inicio"
      >

        <rect
          class="hit"
          x="185"
          y="45"
          width="470"
          height="125"
          rx="4"
        />

        <rect
          class="focus-outline"
          x="190"
          y="50"
          width="460"
          height="115"
          rx="4"
        />

      </a>


      <a
        class="menu-link"
        href="./index.html#concepto"
        xlink:href="./index.html#concepto"
        aria-label="Concepto"
      >

        <rect
          class="hit"
          x="1174"
          y="35"
          width="126"
          height="47"
          rx="4"
        />

        <line
          class="menu-underline"
          x1="1187"
          y1="88"
          x2="1286"
          y2="88"
        />

        <rect
          class="focus-outline"
          x="1180"
          y="43"
          width="113"
          height="26"
          rx="3"
        />

      </a>


      <a
        class="menu-link"
        href="./index.html#estetica"
        xlink:href="./index.html#estetica"
        aria-label="Estética"
      >

        <rect
          class="hit"
          x="1330"
          y="35"
          width="112"
          height="47"
          rx="4"
        />

        <line
          class="menu-underline"
          x1="1343"
          y1="88"
          x2="1428"
          y2="88"
        />

        <rect
          class="focus-outline"
          x="1336"
          y="43"
          width="99"
          height="26"
          rx="3"
        />

      </a>


      <a
        class="menu-link"
        href="./contacto.html"
        xlink:href="./contacto.html"
        aria-label="Contacto"
      >

        <rect
          class="hit"
          x="1472"
          y="35"
          width="126"
          height="47"
          rx="4"
        />

        <line
          class="menu-underline"
          x1="1485"
          y1="88"
          x2="1584"
          y2="88"
        />

        <rect
          class="focus-outline"
          x="1478"
          y="43"
          width="113"
          height="26"
          rx="3"
        />

      </a>


      <!-- Instagram -->
      <a
        href="https://www.instagram.com/claraortiz.uy/"
        xlink:href="https://www.instagram.com/claraortiz.uy/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram de Clara Ortiz"
      >
        <rect class="hit" x="1050" y="535" width="580" height="72" rx="6" />
      </a>

      <!-- Email -->
      <a
        href="mailto:soyclaraortiz@gmail.com"
        xlink:href="mailto:soyclaraortiz@gmail.com"
        aria-label="Enviar correo a Clara Ortiz"
      >
        <rect class="hit" x="1050" y="607" width="580" height="72" rx="6" />
      </a>


    </svg>


    <nav id="mobileMenu" class="mobile-menu" aria-label="Menú móvil">
      <button id="mobileMenuClose" class="mobile-menu-close" type="button" aria-label="Cerrar menú">×</button>
      <div class="mobile-menu-inner">
        <a href="./index.html#concepto">Concepto</a>
        <a href="./index.html#estetica">Estética</a>
        <a href="./contacto.html">Contacto</a>
      </div>
    </nav>


  </main>


  <script>

    const mobileMenuButton = document.getElementById("mobileMenuButton");
    const mobileMenu = document.getElementById("mobileMenu");
    const mobileMenuClose = document.getElementById("mobileMenuClose");

    function closeMobileMenu() {
      mobileMenu.classList.remove("open");
    }

    mobileMenuButton.addEventListener("click", function(event) {
      event.preventDefault();
      mobileMenu.classList.add("open");
    });

    mobileMenuClose.addEventListener("click", closeMobileMenu);

    mobileMenu.addEventListener("click", function(event) {
      if (event.target === mobileMenu) closeMobileMenu();
    });

    mobileMenu.querySelectorAll("a").forEach(function(link) {
      link.addEventListener("click", closeMobileMenu);
    });

  </script>

</body>

</html>
