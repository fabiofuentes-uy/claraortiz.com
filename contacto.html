<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Clara Ortiz</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #d8cdc1;
    }

    body {
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contacto {
      width: 100vw;
      height: 100vh;
      height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contacto img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;

      user-select: none;
      -webkit-user-drag: none;
    }

  </style>
</head>


<body>

  <main class="contacto">

    <img
      src="./contacto.jpg"
      alt="Clara Ortiz — Contacto"
    >

  </main>

</body>

</html>
