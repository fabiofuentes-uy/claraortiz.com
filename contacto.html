<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Clara Ortiz</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      background: #d1c5b8;
    }


    body {
      overflow: hidden;
    }


    .page {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: #d1c5b8;
    }


    .page-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }


    .hit {
      fill: transparent;
      pointer-events: all;
      cursor: pointer;
    }


    .menu-underline {
      stroke: #6e5139;
      stroke-width: 1.4;
      vector-effect: non-scaling-stroke;
      opacity: 0;
      transition: opacity .18s ease;
      pointer-events: none;
    }


    .menu-link:hover .menu-underline,
    .menu-link:focus .menu-underline {
      opacity: 1;
    }


    .focus-outline {
      fill: none;
      stroke: #6e5139;
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
      opacity: 0;
      pointer-events: none;
    }


    .menu-link:focus-visible .focus-outline,
    .home-link:focus-visible .focus-outline {
      opacity: .75;
    }


    a {
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

  </style>

</head>


<body>


  <main class="page">


    <svg
      class="page-svg"
      viewBox="0 0 1670 941"
      preserveAspectRatio="xMidYMid slice"
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      aria-label="Contacto — Clara Ortiz"
    >


      <image
        href="./contacto.jpg"
        xlink:href="./contacto.jpg"
        x="0"
        y="0"
        width="1670"
        height="941"
        preserveAspectRatio="none"
      />


      <a
        class="home-link"
        href="./index.html"
        xlink:href="./index.html"
        aria-label="Volver al inicio"
      >

        <rect
          class="hit"
          x="185"
          y="45"
          width="470"
          height="125"
          rx="4"
        />

        <rect
          class="focus-outline"
          x="190"
          y="50"
          width="460"
          height="115"
          rx="4"
        />

      </a>


      <a
        class="menu-link"
        href="./index.html#concepto"
        xlink:href="./index.html#concepto"
        aria-label="Concepto"
      >

        <rect
          class="hit"
          x="1174"
          y="35"
          width="126"
          height="47"
          rx="4"
        />

        <line
          class="menu-underline"
          x1="1187"
          y1="68"
          x2="1286"
          y2="68"
        />

        <rect
          class="focus-outline"
          x="1180"
          y="43"
          width="113"
          height="26"
          rx="3"
        />

      </a>


      <a
        class="menu-link"
        href="./index.html#estetica"
        xlink:href="./index.html#estetica"
        aria-label="Estética"
      >

        <rect
          class="hit"
          x="1330"
          y="35"
          width="112"
          height="47"
          rx="4"
        />

        <line
          class="menu-underline"
          x1="1343"
          y1="68"
          x2="1428"
          y2="68"
        />

        <rect
          class="focus-outline"
          x="1336"
          y="43"
          width="99"
          height="26"
          rx="3"
        />

      </a>


      <a
        class="menu-link"
        href="./contacto.html"
        xlink:href="./contacto.html"
        aria-label="Contacto"
      >

        <rect
          class="hit"
          x="1472"
          y="35"
          width="126"
          height="47"
          rx="4"
        />

        <line
          class="menu-underline"
          x1="1485"
          y1="68"
          x2="1584"
          y2="68"
        />

        <rect
          class="focus-outline"
          x="1478"
          y="43"
          width="113"
          height="26"
          rx="3"
        />

      </a>


    </svg>


  </main>


</body>

</html>
