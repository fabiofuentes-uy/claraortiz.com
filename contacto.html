<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Clara Ortiz</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      background: #d8cdc1;
    }


    /* ======================================================
       TRANSICIÓN ENTRE PÁGINAS
       ====================================================== */

    body {
      overflow: hidden;

      opacity: 0;

      transition:
        opacity 0.55s ease;
    }


    body.page-loaded {
      opacity: 1;
    }


    body.page-leaving {
      opacity: 0;
    }


    /* ======================================================
       ESCENARIO

       contacto.jpg = 1670 × 942
       ====================================================== */

    .page {

      position: relative;

      width: min(
        100vw,
        calc(100svh * 1670 / 942)
      );

      aspect-ratio: 1670 / 942;

      margin: auto;

      overflow: hidden;
    }


    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* ======================================================
       IMAGEN
       ====================================================== */

    .page-image {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: fill;

      display: block;

      user-select: none;

      -webkit-user-drag: none;

      pointer-events: none;
    }


    /* ======================================================
       SVG INTERACTIVO

       Usa exactamente el mismo sistema 1670 × 942
       que contacto.jpg.
       ====================================================== */

    .overlay {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      z-index: 10;
    }


    .hit {

      fill: transparent;

      pointer-events: all;

      cursor: pointer;
    }


    /* ======================================================
       RAYITAS

       Se dibujan en la coordenada exacta
       del menú original.
       ====================================================== */

    .menu-line {

      stroke: #6e5139;

      stroke-width: 1.2;

      vector-effect: non-scaling-stroke;

      opacity: 0;

      transition:
        opacity 0.25s ease;

      pointer-events: none;
    }


    .menu-link:hover .menu-line,
    .menu-link:focus .menu-line {

      opacity: 1;
    }


    /* ======================================================
       CELULAR
       ====================================================== */

    @media
    (max-width: 700px)
    and
    (orientation: portrait) {

      body {

        align-items: flex-start;

        overflow-x: hidden;
        overflow-y: auto;
      }


      .page {

        width: 100vw;

        height: auto;

        aspect-ratio: 1670 / 942;
      }

    }


    @media
    (max-height: 500px)
    and
    (orientation: landscape) {

      .page {

        width: auto;

        height: 100svh;

        aspect-ratio: 1670 / 942;
      }

    }

  </style>

</head>



<body>


  <main class="page">


    <!-- ==================================================
         IMAGEN
         ================================================== -->

    <img
      class="page-image"
      src="./contacto.jpg"
      alt="Clara Ortiz — Contacto"
    >



    <!-- ==================================================
         NAVEGACIÓN

         Exactamente las mismas coordenadas
         que contacto.jpg
         ================================================== -->

    <svg

      class="overlay"

      viewBox="0 0 1670 942"

      preserveAspectRatio="none"

      xmlns="http://www.w3.org/2000/svg"

      aria-label="Navegación Clara Ortiz"

    >



      <!-- =================================================
           LOGO → HOME
           ================================================= -->

      <a
        class="internal-link"
        href="index.html"
        aria-label="Inicio"
      >

        <rect

          class="hit"

          x="165"
          y="38"

          width="420"
          height="105"

        />

      </a>



      <!-- =================================================
           CONCEPTO

           Texto real:
           x = 1179 → 1286

           Línea:
           y = 82
           ================================================= -->

      <a

        class="menu-link internal-link"

        href="concepto.html"

        aria-label="Concepto"

      >


        <rect

          class="hit"

          x="1165"
          y="37"

          width="135"
          height="58"

        />


        <line

          class="menu-line"

          x1="1179"
          y1="82"

          x2="1286"
          y2="82"

        />


      </a>



      <!-- =================================================
           ESTÉTICA

           Texto real:
           x = 1339 → 1430

           Línea:
           y = 82
           ================================================= -->

      <a

        class="menu-link internal-link"

        href="estetica.html"

        aria-label="Estética"

      >


        <rect

          class="hit"

          x="1325"
          y="37"

          width="120"
          height="58"

        />


        <line

          class="menu-line"

          x1="1339"
          y1="82"

          x2="1430"
          y2="82"

        />


      </a>



      <!-- =================================================
           CONTACTO

           La rayita YA FORMA PARTE de contacto.jpg.
           No dibujamos otra encima.
           ================================================= -->

      <a

        href="contacto.html"

        aria-label="Contacto"

      >


        <rect

          class="hit"

          x="1468"
          y="37"

          width="136"
          height="58"

        />


      </a>


    </svg>


  </main>



  <script>

    /* ======================================================
       ENTRADA SUAVE
       ====================================================== */

    function mostrarPagina() {

      requestAnimationFrame(
        function () {

          document.body
            .classList
            .add("page-loaded");

        }
      );

    }


    window.addEventListener(
      "DOMContentLoaded",
      mostrarPagina
    );



    /* ======================================================
       SALIDA SUAVE
       ====================================================== */

    document.addEventListener(
      "click",
      function(event) {


        const link =
          event.target.closest(
            "a.internal-link"
          );


        if (!link) {
          return;
        }


        const href =
          link.getAttribute("href");


        if (!href) {
          return;
        }


        event.preventDefault();


        document.body
          .classList
          .remove("page-loaded");


        document.body
          .classList
          .add("page-leaving");



        /*
          Esperamos a que termine
          casi todo el fade.
        */

        setTimeout(
          function() {

            window.location.href =
              href;

          },

          500
        );


      }
    );



    /* ======================================================
       ATRÁS / ADELANTE DEL NAVEGADOR
       ====================================================== */

    window.addEventListener(
      "pageshow",
      function() {


        document.body
          .classList
          .remove("page-leaving");


        requestAnimationFrame(
          function() {

            document.body
              .classList
              .add("page-loaded");

          }
        );


      }
    );


  </script>


</body>

</html>
