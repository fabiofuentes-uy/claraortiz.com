<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clara Ortiz — Punta del Este</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #eee8e1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /*
      IMPORTANTE:
      home.jpg mide 1670 × 941 px.
      La proporción de la web usa exactamente esa medida.
    */
    .home {
      position: relative;
      width: min(100vw, calc(100vh * 1.774707758));
      height: min(100vh, calc(100vw / 1.774707758));
      overflow: visible;
    }

    .home-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .link {
      position: absolute;
      z-index: 10;
      display: block;
      cursor: pointer;
      text-decoration: none;
    }

    /*
      MENÚ
      Los hotspots están ajustados al texto real de la imagen.
      En hover NO aparece un rectángulo grande:
      solamente una línea fina y precisa debajo.
    */
    .menu-link::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -5px;
      height: 1px;
      background: rgba(92, 66, 44, 0.95);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.22s ease;
    }

    .menu-link:hover::after {
      transform: scaleX(1);
    }

    /*
      BOTÓN SUSCRIBIRME
      El efecto queda contenido dentro del botón original,
      sin correrse, agrandarse ni generar sombra externa.
    */
    .subscribe {
      border-radius: 999px;
      transition: box-shadow 0.22s ease, background-color 0.22s ease;
    }

    .subscribe:hover {
      background: rgba(255, 255, 255, 0.07);
      box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, 0.38),
        inset 0 0 16px rgba(255, 255, 255, 0.08);
    }

    /*
      POSICIONES EXACTAS
      calculadas sobre home.jpg = 1670 × 941
    */

    .subscribe {
      left: 10.7784%;
      top: 44.9522%;
      width: 14.3114%;
      height: 5.8448%;
    }

    .concepto {
      left: 70.8982%;
      top: 4.9947%;
      width: 6.2275%;
      height: 1.9129%;
    }

    .estetica {
      left: 80.2395%;
      top: 4.9947%;
      width: 5.3892%;
      height: 1.9129%;
    }

    .contacto {
      left: 88.7425%;
      top: 4.9947%;
      width: 6.2275%;
      height: 1.9129%;
    }

    .link:focus-visible {
      outline: 1px solid rgba(92, 66, 44, 0.85);
      outline-offset: 3px;
    }

    @media (max-width: 700px) {
      body {
        overflow: auto;
        align-items: flex-start;
      }

      .home {
        width: 100vw;
        height: calc(100vw / 1.774707758);
      }
    }
  </style>
</head>

<body>
  <main class="home">

    <img
      class="home-image"
      src="./home.jpg"
      alt="Clara Ortiz — Punta del Este"
    >

    <a
      class="link subscribe"
      href="#suscribirme"
      aria-label="Suscribirme a Clara Ortiz"
      title="Suscribirme"
    ></a>

    <a
      class="link menu-link concepto"
      href="#concepto"
      aria-label="Concepto"
      title="Concepto"
    ></a>

    <a
      class="link menu-link estetica"
      href="#estetica"
      aria-label="Estética"
      title="Estética"
    ></a>

    <a
      class="link menu-link contacto"
      href="#contacto"
      aria-label="Contacto"
      title="Contacto"
    ></a>

  </main>
</body>
</html>
