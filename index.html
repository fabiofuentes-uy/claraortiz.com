<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Evita que el navegador siga mostrando una versión vieja del index -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Clara Ortiz — Punta del Este</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #eee8e1;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /*
      home.jpg = 1670 × 941 px.
      Imagen y SVG comparten EXACTAMENTE el mismo sistema de coordenadas.
    */
    .hero {
      position: relative;
      width: min(100vw, calc(100vh * 1670 / 941));
      aspect-ratio: 1670 / 941;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .hit {
      fill: transparent;
      pointer-events: all;
      cursor: pointer;
    }

    /*
      MENÚ:
      la línea aparece exactamente debajo del texto impreso en home.jpg.
      No hay rectángulo de fondo, así que no puede verse desplazado.
    */
    .menu-underline {
      stroke: #6e5139;
      stroke-width: 1.4;
      vector-effect: non-scaling-stroke;
      opacity: 0;
      transition: opacity .18s ease;
      pointer-events: none;
    }

    .menu-link:hover .menu-underline,
    .menu-link:focus .menu-underline {
      opacity: 1;
    }

    /*
      SUSCRIBIRME:
      el realce está DENTRO del botón marrón de la propia imagen.
      Coordenadas medidas directamente sobre home.jpg.
    */
    .subscribe-highlight {
      fill: rgba(255, 255, 255, 0.07);
      stroke: rgba(255, 255, 255, 0.68);
      stroke-width: 1.4;
      vector-effect: non-scaling-stroke;
      opacity: 0;
      transition: opacity .18s ease;
      pointer-events: none;
    }

    .subscribe-link:hover .subscribe-highlight,
    .subscribe-link:focus .subscribe-highlight {
      opacity: 1;
    }

    /*
      Foco visible solamente al navegar con teclado.
    */
    .focus-outline {
      fill: none;
      stroke: #6e5139;
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
      opacity: 0;
      pointer-events: none;
    }

    .menu-link:focus-visible .focus-outline,
    .subscribe-link:focus-visible .focus-outline {
      opacity: .8;
    }

    @media (max-width: 700px) {
      body {
        min-height: auto;
        display: block;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .hero {
        width: 100vw;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <img
      class="hero-image"
      src="./home.jpg?v=4"
      alt="Clara Ortiz — Punta del Este"
    >

    <!--
      SVG con el mismo viewBox que la imagen real (1670 × 941).
      Por eso los efectos no se corren al cambiar el tamaño de pantalla.
    -->
    <svg
      class="overlay"
      viewBox="0 0 1670 941"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-label="Navegación de Clara Ortiz"
    >

      <!-- SUSCRIBIRME
           Botón marrón medido: x 181–419 / y 424–478 -->
      <a
        class="subscribe-link"
        href="#suscribirme"
        aria-label="Suscribirme"
      >
        <!-- zona cómoda para el mouse -->
        <rect class="hit" x="172" y="414" width="256" height="74" rx="37"/>

        <!-- realce exacto dentro del botón -->
        <rect
          class="subscribe-highlight"
          x="181.5"
          y="424.5"
          width="237"
          height="53"
          rx="26.5"
        />

        <rect
          class="focus-outline"
          x="178"
          y="421"
          width="244"
          height="60"
          rx="30"
        />
      </a>


      <!-- CONCEPTO
           Texto real: x 1187–1286 / y 50–61 -->
      <a
        class="menu-link"
        href="#concepto"
        aria-label="Concepto"
      >
        <rect class="hit" x="1174" y="35" width="126" height="47" rx="4"/>

        <line
          class="menu-underline"
          x1="1187"
          y1="68"
          x2="1286"
          y2="68"
        />

        <rect
          class="focus-outline"
          x="1180"
          y="43"
          width="113"
          height="26"
          rx="3"
        />
      </a>


      <!-- ESTÉTICA
           Texto real: x 1343–1428 / y 50–61 -->
      <a
        class="menu-link"
        href="#estetica"
        aria-label="Estética"
      >
        <rect class="hit" x="1330" y="35" width="112" height="47" rx="4"/>

        <line
          class="menu-underline"
          x1="1343"
          y1="68"
          x2="1428"
          y2="68"
        />

        <rect
          class="focus-outline"
          x="1336"
          y="43"
          width="99"
          height="26"
          rx="3"
        />
      </a>


      <!-- CONTACTO
           Texto real: x 1485–1584 / y 50–61 -->
      <a
        class="menu-link"
        href="#contacto"
        aria-label="Contacto"
      >
        <rect class="hit" x="1472" y="35" width="126" height="47" rx="4"/>

        <line
          class="menu-underline"
          x1="1485"
          y1="68"
          x2="1584"
          y2="68"
        />

        <rect
          class="focus-outline"
          x="1478"
          y="43"
          width="113"
          height="26"
          rx="3"
        />
      </a>

    </svg>

  </main>

</body>
</html>
