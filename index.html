<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Clara Ortiz — Punta del Este</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #eee8e1;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    /* ======================================================
       CONTENEDOR RESPONSIVE
       home.jpg = 1670 × 941
       ====================================================== */

    .hero {
      position: relative;

      width: min(
        100vw,
        calc(100svh * 1670 / 941)
      );

      aspect-ratio: 1670 / 941;

      flex-shrink: 0;

      overflow: hidden;
    }


    /* ======================================================
       IMAGEN PRINCIPAL
       ====================================================== */

    .hero-image {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;

      user-select: none;
      -webkit-user-drag: none;

      pointer-events: none;
    }


    /* ======================================================
       CAPA INTERACTIVA
       ====================================================== */

    .overlay {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      overflow: visible;
    }


    .hit {
      fill: transparent;

      pointer-events: all;

      cursor: pointer;
    }


    /* ======================================================
       MENÚ SUPERIOR
       SOLO RAYITA
       ====================================================== */

    .menu-underline {
      stroke: #6e5139;

      stroke-width: 1.4;

      vector-effect: non-scaling-stroke;

      opacity: 0;

      transition:
        opacity 0.20s ease;

      pointer-events: none;
    }


    .menu-link:hover .menu-underline,
    .menu-link:focus .menu-underline {
      opacity: 1;
    }


    /* ======================================================
       SUSCRIBIRME
       ====================================================== */

    .subscribe-highlight {
      fill: rgba(255, 255, 255, 0.06);

      stroke: rgba(255, 255, 255, 0.55);

      stroke-width: 1.2;

      vector-effect: non-scaling-stroke;

      opacity: 0;

      transition:
        opacity 0.20s ease;

      pointer-events: none;
    }


    .subscribe-link:hover .subscribe-highlight,
    .subscribe-link:focus .subscribe-highlight {
      opacity: 1;
    }


    /* ======================================================
       ACCESIBILIDAD
       ====================================================== */

    .focus-outline {
      fill: none;

      stroke: #6e5139;

      stroke-width: 1.4;

      vector-effect: non-scaling-stroke;

      opacity: 0;

      pointer-events: none;
    }


    .menu-link:focus-visible .focus-outline,
    .subscribe-link:focus-visible .focus-outline {
      opacity: 0.8;
    }


    /* ======================================================
       TABLETS / NOTEBOOKS
       ====================================================== */

    @media
    (max-width: 1100px),
    (max-height: 700px) {

      .hero {
        width: min(
          100vw,
          calc(100svh * 1670 / 941)
        );
      }

    }


    /* ======================================================
       CELULAR VERTICAL
       ====================================================== */

    @media
    (max-width: 700px)
    and (orientation: portrait) {

      body {
        align-items: flex-start;

        overflow-x: hidden;
        overflow-y: auto;
      }

      .hero {
        width: 100vw;

        height: auto;

        aspect-ratio: 1670 / 941;
      }

    }


    /* ======================================================
       CELULAR HORIZONTAL
       ====================================================== */

    @media
    (max-height: 500px)
    and (orientation: landscape) {

      .hero {
        width: auto;

        height: 100svh;

        aspect-ratio: 1670 / 941;
      }

    }

  </style>
</head>


<body>


  <main class="hero">


    <!-- IMAGEN PRINCIPAL -->

    <img
      class="hero-image"
      src="./home.jpg"
      alt="Clara Ortiz — Punta del Este"
    >



    <!--
      SVG INTERACTIVO
      Misma proporción que home.jpg
    -->

    <svg
      class="overlay"
      viewBox="0 0 1670 941"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-label="Navegación de Clara Ortiz"
    >


      <!-- =================================================
           SUSCRIBIRME
           ================================================= -->

      <a
        class="subscribe-link"
        href="#suscribirme"
        aria-label="Suscribirme"
      >


        <rect
          class="hit"
          x="172"
          y="414"
          width="256"
          height="74"
          rx="37"
        />


        <rect
          class="subscribe-highlight"
          x="181.5"
          y="424.5"
          width="237"
          height="53"
          rx="26.5"
        />


        <rect
          class="focus-outline"
          x="178"
          y="421"
          width="244"
          height="60"
          rx="30"
        />


      </a>



      <!-- =================================================
           CONCEPTO
           ================================================= -->

      <a
        class="menu-link"
        href="#concepto"
        aria-label="Concepto"
      >


        <rect
          class="hit"
          x="1174"
          y="35"
          width="126"
          height="47"
          rx="4"
        />


        <line
          class="menu-underline"
          x1="1187"
          y1="68"
          x2="1286"
          y2="68"
        />


        <rect
          class="focus-outline"
          x="1180"
          y="43"
          width="113"
          height="26"
          rx="3"
        />


      </a>



      <!-- =================================================
           ESTÉTICA
           ================================================= -->

      <a
        class="menu-link"
        href="#estetica"
        aria-label="Estética"
      >


        <rect
          class="hit"
          x="1330"
          y="35"
          width="112"
          height="47"
          rx="4"
        />


        <line
          class="menu-underline"
          x1="1343"
          y1="68"
          x2="1428"
          y2="68"
        />


        <rect
          class="focus-outline"
          x="1336"
          y="43"
          width="99"
          height="26"
          rx="3"
        />


      </a>



      <!-- =================================================
           CONTACTO
           ================================================= -->

      <a
        class="menu-link"
        href="#contacto"
        aria-label="Contacto"
      >


        <rect
          class="hit"
          x="1472"
          y="35"
          width="126"
          height="47"
          rx="4"
        />


        <line
          class="menu-underline"
          x1="1485"
          y1="68"
          x2="1584"
          y2="68"
        />


        <rect
          class="focus-outline"
          x="1478"
          y="43"
          width="113"
          height="26"
          rx="3"
        />


      </a>


    </svg>


  </main>


</body>

</html>
