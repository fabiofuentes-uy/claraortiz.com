<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Clara Ortiz — Punta del Este</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #eee8e1;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }


    /* ======================================================
       PORTADA RESPONSIVE
       home.jpg = 1670 × 941
       ====================================================== */

    .hero {
      position: relative;

      width: min(
        100vw,
        calc(100svh * 1670 / 941)
      );

      aspect-ratio: 1670 / 941;

      flex-shrink: 0;

      overflow: hidden;
    }


    .hero-image {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;

      user-select: none;
      -webkit-user-drag: none;

      pointer-events: none;
    }


    /* ======================================================
       SVG INTERACTIVO
       ====================================================== */

    .overlay {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      overflow: visible;
    }


    .hit {
      fill: transparent;

      pointer-events: all;

      cursor: pointer;
    }


    /* ======================================================
       MENÚ
       ====================================================== */

    .menu-underline {
      stroke: #6e5139;

      stroke-width: 1.4;

      vector-effect: non-scaling-stroke;

      opacity: 0;

      transition: opacity 0.20s ease;

      pointer-events: none;
    }


    .menu-link:hover .menu-underline,
    .menu-link:focus .menu-underline {
      opacity: 1;
    }


    /* ======================================================
       SUSCRIBIRME
       ====================================================== */

    .subscribe-highlight {
      fill: rgba(255, 255, 255, 0.06);

      stroke: rgba(255, 255, 255, 0.55);

      stroke-width: 1.2;

      vector-effect: non-scaling-stroke;

      opacity: 0;

      transition: opacity 0.20s ease;

      pointer-events: none;
    }


    .subscribe-link:hover .subscribe-highlight,
    .subscribe-link:focus .subscribe-highlight {
      opacity: 1;
    }


    /* ======================================================
       FOCO
       ====================================================== */

    .focus-outline {
      fill: none;

      stroke: #6e5139;

      stroke-width: 1.4;

      vector-effect: non-scaling-stroke;

      opacity: 0;

      pointer-events: none;
    }


    .menu-link:focus-visible .focus-outline,
    .subscribe-link:focus-visible .focus-outline {
      opacity: 0.8;
    }


    /* ======================================================
       CUADRO DE SUSCRIPCIÓN
       ====================================================== */

    dialog {
      width: min(92vw, 440px);

      border: none;

      border-radius: 3px;

      padding: 0;

      background: #f2ece5;

      color: #624a37;

      box-shadow:
        0 28px 80px rgba(52, 39, 28, 0.22);

      overflow: hidden;
    }


    dialog::backdrop {
      background: rgba(54, 42, 33, 0.28);

      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }


    .modal-content {
      position: relative;

      padding: 46px 46px 40px;
    }


    .modal-close {
      position: absolute;

      top: 14px;
      right: 18px;

      width: 34px;
      height: 34px;

      border: none;

      background: transparent;

      color: #755a45;

      font-size: 25px;
      font-weight: 300;

      line-height: 1;

      cursor: pointer;

      opacity: 0.65;

      transition: opacity 0.2s ease;
    }


    .modal-close:hover {
      opacity: 1;
    }


    .modal-brand {
      margin-bottom: 9px;

      font-size: 11px;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      color: #927b68;
    }


    .modal-title {
      margin-bottom: 10px;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 29px;

      line-height: 1.12;

      font-weight: 400;

      color: #5e4634;
    }


    .modal-intro {
      margin-bottom: 28px;

      font-size: 14px;

      line-height: 1.55;

      color: #816b59;
    }


    .field {
      margin-bottom: 19px;
    }


    .field label {
      display: block;

      margin-bottom: 7px;

      font-size: 11px;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      color: #765e4c;
    }


    .field input {
      width: 100%;

      padding: 11px 2px 10px;

      border: none;
      border-bottom: 1px solid #c7b8ab;

      border-radius: 0;

      outline: none;

      background: transparent;

      color: #4f3c2e;

      font-family: inherit;

      font-size: 15px;

      transition: border-color 0.2s ease;
    }


    .field input::placeholder {
      color: #b4a69a;
    }


    .field input:focus {
      border-bottom-color: #71543e;
    }


    .contact-hint {
      margin-top: -7px;
      margin-bottom: 22px;

      font-size: 12px;

      line-height: 1.45;

      color: #9b897b;
    }


    .form-error {
      display: none;

      margin-bottom: 16px;

      font-size: 12px;

      color: #8a493f;
    }


    .submit-button {
      width: 100%;

      margin-top: 5px;

      padding: 14px 20px;

      border: 1px solid #70523d;

      border-radius: 30px;

      background: #70523d;

      color: #f8f3ee;

      font-family: inherit;

      font-size: 12px;

      letter-spacing: 0.12em;

      text-transform: uppercase;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }


    .submit-button:hover {
      background: #5e4433;

      transform: translateY(-1px);
    }


    .submit-button:disabled {
      opacity: 0.55;

      cursor: default;

      transform: none;
    }


    /* ======================================================
       MENSAJE DE GRACIAS
       ====================================================== */

    .success {
      display: none;

      text-align: center;

      padding: 18px 0 8px;
    }


    .success-title {
      margin-bottom: 12px;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 34px;

      font-weight: 400;

      color: #5e4634;
    }


    .success-text {
      margin: 0 auto 30px;

      max-width: 290px;

      font-size: 14px;

      line-height: 1.6;

      color: #816b59;
    }


    .success-close {
      padding: 12px 32px;

      border: 1px solid #71543e;

      border-radius: 30px;

      background: transparent;

      color: #71543e;

      font-family: inherit;

      font-size: 11px;

      letter-spacing: 0.12em;

      text-transform: uppercase;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }


    .success-close:hover {
      background: #71543e;

      color: #f5eee8;
    }


    /* ======================================================
       RESPONSIVE
       ====================================================== */

    @media
    (max-width: 700px)
    and (orientation: portrait) {

      body {
        align-items: flex-start;

        overflow-x: hidden;
        overflow-y: auto;
      }


      .hero {
        width: 100vw;

        height: auto;

        aspect-ratio: 1670 / 941;
      }


      .modal-content {
        padding: 42px 30px 34px;
      }


      .modal-title {
        font-size: 27px;
      }

    }


    @media
    (max-height: 500px)
    and (orientation: landscape) {

      .hero {
        width: auto;

        height: 100svh;

        aspect-ratio: 1670 / 941;
      }


      dialog {
        max-height: 92vh;

        overflow-y: auto;
      }

    }

  </style>
</head>


<body>


  <!-- ======================================================
       PORTADA
       ====================================================== -->

  <main class="hero">


    <img
      class="hero-image"
      src="./home.jpg"
      alt="Clara Ortiz — Punta del Este"
    >



    <svg
      class="overlay"
      viewBox="0 0 1670 941"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-label="Navegación de Clara Ortiz"
    >


      <!-- SUSCRIBIRME -->

      <a
        class="subscribe-link"
        id="openSubscribe"
        href="#"
        aria-label="Suscribirme"
      >

        <rect
          class="hit"
          x="172"
          y="414"
          width="256"
          height="74"
          rx="37"
        />


        <rect
          class="subscribe-highlight"
          x="181.5"
          y="424.5"
          width="237"
          height="53"
          rx="26.5"
        />


        <rect
          class="focus-outline"
          x="178"
          y="421"
          width="244"
          height="60"
          rx="30"
        />

      </a>



      <!-- CONCEPTO -->

      <a
        class="menu-link"
        href="#concepto"
        aria-label="Concepto"
      >

        <rect
          class="hit"
          x="1174"
          y="35"
          width="126"
          height="47"
          rx="4"
        />


        <line
          class="menu-underline"
          x1="1187"
          y1="68"
          x2="1286"
          y2="68"
        />


        <rect
          class="focus-outline"
          x="1180"
          y="43"
          width="113"
          height="26"
          rx="3"
        />

      </a>



      <!-- ESTÉTICA -->

      <a
        class="menu-link"
        href="#estetica"
        aria-label="Estética"
      >

        <rect
          class="hit"
          x="1330"
          y="35"
          width="112"
          height="47"
          rx="4"
        />


        <line
          class="menu-underline"
          x1="1343"
          y1="68"
          x2="1428"
          y2="68"
        />


        <rect
          class="focus-outline"
          x="1336"
          y="43"
          width="99"
          height="26"
          rx="3"
        />

      </a>



      <!-- CONTACTO -->

      <a
        class="menu-link"
        href="#contacto"
        aria-label="Contacto"
      >

        <rect
          class="hit"
          x="1472"
          y="35"
          width="126"
          height="47"
          rx="4"
        />


        <line
          class="menu-underline"
          x1="1485"
          y1="68"
          x2="1584"
          y2="68"
        />


        <rect
          class="focus-outline"
          x="1478"
          y="43"
          width="113"
          height="26"
          rx="3"
        />

      </a>


    </svg>


  </main>



  <!-- ======================================================
       CUADRO DE SUSCRIPCIÓN
       ====================================================== -->

  <dialog id="subscribeModal">


    <div class="modal-content">


      <button
        class="modal-close"
        id="closeModal"
        type="button"
        aria-label="Cerrar"
      >
        ×
      </button>



      <!-- FORMULARIO -->

      <div id="formView">


        <div class="modal-brand">
          Clara Ortiz
        </div>


        <h2 class="modal-title">
          ¿Cómo nos comunicamos contigo?
        </h2>


        <p class="modal-intro">
          Dejanos tus datos y te contamos lo que se viene.
        </p>



        <form id="subscribeForm">


          <div class="field">

            <label for="nombre">
              Nombre
            </label>

            <input
              id="nombre"
              name="Nombre"
              type="text"
              placeholder="Tu nombre"
              autocomplete="name"
              required
            >

          </div>



          <div class="field">

            <label for="whatsapp">
              WhatsApp
            </label>

            <input
              id="whatsapp"
              name="WhatsApp"
              type="tel"
              placeholder="+54 ..."
              autocomplete="tel"
            >

          </div>



          <div class="field">

            <label for="email">
              Mail
            </label>

            <input
              id="email"
              name="Email"
              type="email"
              placeholder="nombre@correo.com"
              autocomplete="email"
            >

          </div>



          <p class="contact-hint">
            Podés dejarnos tu WhatsApp, tu mail o ambos.
          </p>


          <p
            class="form-error"
            id="formError"
          >
            Necesitamos al menos un WhatsApp o un mail para poder comunicarnos contigo.
          </p>



          <!-- Anti-spam -->

          <input
            type="text"
            name="_honey"
            style="display:none"
          >


          <input
            type="hidden"
            name="_subject"
            value="Nueva suscripción desde ClaraOrtiz.com"
          >


          <input
            type="hidden"
            name="_template"
            value="table"
          >



          <button
            class="submit-button"
            id="submitButton"
            type="submit"
          >
            Enviar
          </button>


        </form>

      </div>



      <!-- GRACIAS -->

      <div
        class="success"
        id="successView"
      >


        <div class="modal-brand">
          Clara Ortiz
        </div>


        <h2 class="success-title">
          Gracias.
        </h2>


        <p class="success-text">
          Ya tenemos tus datos. Muy pronto vas a saber de nosotros.
        </p>


        <button
          class="success-close"
          id="successClose"
          type="button"
        >
          Cerrar
        </button>


      </div>


    </div>


  </dialog>



  <!-- ======================================================
       JAVASCRIPT
       ====================================================== -->

  <script>

    const openSubscribe =
      document.getElementById("openSubscribe");

    const modal =
      document.getElementById("subscribeModal");

    const closeModal =
      document.getElementById("closeModal");

    const successClose =
      document.getElementById("successClose");

    const form =
      document.getElementById("subscribeForm");

    const formView =
      document.getElementById("formView");

    const successView =
      document.getElementById("successView");

    const formError =
      document.getElementById("formError");

    const submitButton =
      document.getElementById("submitButton");



    /* ABRIR */

    openSubscribe.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        formView.style.display = "block";

        successView.style.display = "none";

        formError.style.display = "none";

        modal.showModal();

      }
    );



    /* CERRAR */

    closeModal.addEventListener(
      "click",
      function() {

        modal.close();

      }
    );


    successClose.addEventListener(
      "click",
      function() {

        modal.close();

      }
    );



    /* CERRAR HACIENDO CLICK FUERA */

    modal.addEventListener(
      "click",
      function(event) {

        const rect =
          modal.getBoundingClientRect();

        const clickedOutside =
          event.clientX < rect.left ||
          event.clientX > rect.right ||
          event.clientY < rect.top ||
          event.clientY > rect.bottom;

        if (clickedOutside) {

          modal.close();

        }

      }
    );



    /* ======================================================
       ENVÍO
       ====================================================== */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const whatsapp =
          document
            .getElementById("whatsapp")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();



        /* WhatsApp o email obligatorio */

        if (!whatsapp && !email) {

          formError.style.display = "block";

          return;

        }


        formError.style.display = "none";


        submitButton.disabled = true;

        submitButton.textContent =
          "Enviando...";


        const formData =
          new FormData(form);


        try {


          const response =
            await fetch(
              "https://formsubmit.co/ajax/fabiofuentes@gmail.com",
              {

                method: "POST",

                headers: {
                  "Accept": "application/json"
                },

                body: formData

              }
            );


          if (!response.ok) {

            throw new Error(
              "No se pudo enviar."
            );

          }


          form.reset();


          formView.style.display =
            "none";


          successView.style.display =
            "block";


        }


        catch (error) {


          formError.textContent =
            "No pudimos enviar tus datos. Por favor, intentá nuevamente.";


          formError.style.display =
            "block";


        }


        finally {


          submitButton.disabled =
            false;


          submitButton.textContent =
            "Enviar";


        }


      }
    );

  </script>


</body>

</html>
