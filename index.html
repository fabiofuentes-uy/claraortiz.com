<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Clara Ortiz — Punta del Este</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #eee8e1;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }


    /* ========================================
       IMAGEN PRINCIPAL
    ======================================== */

    .hero {
      position: relative;

      width: min(
        100vw,
        calc(100vh * 1670 / 941)
      );

      aspect-ratio: 1670 / 941;
    }


    .hero-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;
      object-fit: fill;

      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }


    /* ========================================
       SVG DE ENLACES
    ======================================== */

    .overlay {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;
      overflow: visible;
    }


    /*
      Zonas invisibles clickeables.
    */

    .hit {
      fill: transparent;
      pointer-events: all;
      cursor: pointer;
    }



    /* ========================================
       MENÚ SUPERIOR

       NO se ilumina el texto.
       NO cambia de color.
       NO aparece ningún rectángulo.

       Solamente aparece una pequeña línea
       debajo de cada palabra.
    ======================================== */

    .menu-underline {
      stroke: #6e5139;

      stroke-width: 1.4;

      vector-effect: non-scaling-stroke;

      opacity: 0;

      transition: opacity 0.18s ease;

      pointer-events: none;
    }


    .menu-link:hover .menu-underline,
    .menu-link:focus .menu-underline {
      opacity: 1;
    }



    /* ========================================
       SUSCRIBIRME

       Solamente aparece el borde negro.
       Sin iluminación.
       Sin fondo.
       Sin sombra.
       Sin modificar el tamaño.
    ======================================== */

    .subscribe-highlight {

      fill: transparent;

      stroke: rgba(0, 0, 0, 0.88);

      /*
        Antes era más fino.
        Lo aumentamos apenas.
      */
      stroke-width: 2.2;

      vector-effect: non-scaling-stroke;

      opacity: 0;

      transition: opacity 0.18s ease;

      pointer-events: none;
    }


    .subscribe-link:hover .subscribe-highlight,
    .subscribe-link:focus .subscribe-highlight {
      opacity: 1;
    }



    /* ========================================
       FOCO DE TECLADO
    ======================================== */

    .focus-outline {
      fill: none;

      stroke: #6e5139;

      stroke-width: 1.5;

      vector-effect: non-scaling-stroke;

      opacity: 0;

      pointer-events: none;
    }


    .menu-link:focus-visible .focus-outline,
    .subscribe-link:focus-visible .focus-outline {
      opacity: 0.8;
    }



    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 700px) {

      body {
        min-height: auto;

        display: block;

        overflow-x: hidden;
        overflow-y: auto;
      }


      .hero {
        width: 100vw;
      }

    }

  </style>

</head>


<body>


  <main class="hero">


    <!-- IMAGEN PRINCIPAL -->

    <img
      class="hero-image"
      src="./home.jpg?v=6"
      alt="Clara Ortiz — Punta del Este"
    >



    <!--
      SVG con exactamente la misma proporción
      que home.jpg.

      Imagen original:
      1670 × 941 px
    -->

    <svg
      class="overlay"

      viewBox="0 0 1670 941"

      preserveAspectRatio="none"

      xmlns="http://www.w3.org/2000/svg"

      aria-label="Navegación de Clara Ortiz"
    >



      <!-- =====================================
           SUSCRIBIRME
      ====================================== -->

      <a
        class="subscribe-link"

        href="#suscribirme"

        aria-label="Suscribirme"
      >


        <!-- Área cómoda para hacer clic -->

        <rect
          class="hit"

          x="172"
          y="414"

          width="256"
          height="74"

          rx="37"
        />


        <!--
          Borde negro del óvalo.

          Se encuentra exactamente encima
          del botón dibujado en home.jpg.
        -->

        <rect
          class="subscribe-highlight"

          x="181.5"
          y="424.5"

          width="237"
          height="53"

          rx="26.5"
        />


        <!-- Foco para navegación con teclado -->

        <rect
          class="focus-outline"

          x="178"
          y="421"

          width="244"
          height="60"

          rx="30"
        />


      </a>




      <!-- =====================================
           CONCEPTO
      ====================================== -->

      <a
        class="menu-link"

        href="#concepto"

        aria-label="Concepto"
      >


        <!-- Zona clickeable -->

        <rect
          class="hit"

          x="1174"
          y="35"

          width="126"
          height="47"

          rx="4"
        />


        <!-- Línea debajo de CONCEPTO -->

        <line
          class="menu-underline"

          x1="1187"
          y1="68"

          x2="1286"
          y2="68"
        />


        <!-- Foco teclado -->

        <rect
          class="focus-outline"

          x="1180"
          y="43"

          width="113"
          height="26"

          rx="3"
        />


      </a>




      <!-- =====================================
           ESTÉTICA
      ====================================== -->

      <a
        class="menu-link"

        href="#estetica"

        aria-label="Estética"
      >


        <!-- Zona clickeable -->

        <rect
          class="hit"

          x="1330"
          y="35"

          width="112"
          height="47"

          rx="4"
        />


        <!-- Línea debajo de ESTÉTICA -->

        <line
          class="menu-underline"

          x1="1343"
          y1="68"

          x2="1428"
          y2="68"
        />


        <!-- Foco teclado -->

        <rect
          class="focus-outline"

          x="1336"
          y="43"

          width="99"
          height="26"

          rx="3"
        />


      </a>




      <!-- =====================================
           CONTACTO
      ====================================== -->

      <a
        class="menu-link"

        href="contacto.html"

        aria-label="Contacto"
      >


        <!-- Zona clickeable -->

        <rect
          class="hit"

          x="1472"
          y="35"

          width="126"
          height="47"

          rx="4"
        />


        <!-- Línea debajo de CONTACTO -->

        <line
          class="menu-underline"

          x1="1485"
          y1="68"

          x2="1584"
          y2="68"
        />


        <!-- Foco teclado -->

        <rect
          class="focus-outline"

          x="1478"
          y="43"

          width="113"
          height="26"

          rx="3"
        />


      </a>


    </svg>


  </main>


</body>
</html>
