<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Clara Ortiz — Punta del Este</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      background: #eee8e1;
    }


    body {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }



    /* ==================================================
       HOME
    ================================================== */

    .hero {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      width: 100dvw;
      height: 100dvh;

      overflow: hidden;

      background: #eee8e1;

    }


    /*
      Imagen + botones + zonas clickeables
      viven dentro del MISMO SVG.

      Por eso todos escalan juntos.
    */

    .hero-svg {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

    }



    /* ==================================================
       ZONAS CLICKEABLES
    ================================================== */

    .hit {

      fill: transparent;

      pointer-events: all;

      cursor: pointer;

    }



    /* ==================================================
       MENÚ SUPERIOR

       NO ilumina el texto.
       Solamente aparece la rayita.
    ================================================== */

    .menu-underline {

      stroke: #6e5139;

      stroke-width: 1.4;

      vector-effect: non-scaling-stroke;

      opacity: 0;

      transition: opacity .18s ease;

      pointer-events: none;

    }


    .menu-link:hover .menu-underline,
    .menu-link:focus .menu-underline {

      opacity: 1;

    }



    /* ==================================================
       SUSCRIBIRME

       Sin brillo.
       Sin fondo.
       Sin sombra.

       Solamente borde negro.
    ================================================== */

    .subscribe-border {

      fill: transparent;

      stroke: rgba(0, 0, 0, .92);

      stroke-width: 2.4;

      vector-effect: non-scaling-stroke;

      opacity: 0;

      transition: opacity .18s ease;

      pointer-events: none;

    }


    .subscribe-link:hover .subscribe-border,
    .subscribe-link:focus .subscribe-border {

      opacity: 1;

    }



    /* ==================================================
       ACCESIBILIDAD TECLADO
    ================================================== */

    .focus-outline {

      fill: none;

      stroke: #6e5139;

      stroke-width: 1.5;

      vector-effect: non-scaling-stroke;

      opacity: 0;

      pointer-events: none;

    }


    .menu-link:focus-visible .focus-outline,
    .subscribe-link:focus-visible .focus-outline {

      opacity: .8;

    }


    a {

      outline: none;

      -webkit-tap-highlight-color: transparent;

    }



    /* ==================================================
       MODAL SUSCRIBIRME
    ================================================== */

    .subscribe-dialog {

      width: min(92vw, 520px);

      max-height: 90vh;

      margin: auto;

      padding: 0;

      border: 1px solid rgba(42, 36, 31, .28);

      background: #f3efe7;

      color: #28241f;

      box-shadow:
        0 25px 80px rgba(31, 25, 20, .24);

    }


    .subscribe-dialog::backdrop {

      background: rgba(31, 27, 23, .38);

      backdrop-filter: blur(2px);

      -webkit-backdrop-filter: blur(2px);

    }



    .modal-inner {

      position: relative;

      padding: 48px 48px 44px;

    }



    /* X */

    .modal-close-x {

      position: absolute;

      top: 17px;
      right: 19px;

      width: 34px;
      height: 34px;

      border: 0;

      background: transparent;

      color: #28241f;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 25px;

      line-height: 1;

      cursor: pointer;

      opacity: .6;

      transition: opacity .18s ease;

    }


    .modal-close-x:hover {

      opacity: 1;

    }



    /* CLARA ORTIZ */

    .modal-brand {

      margin-bottom: 28px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 14px;

      letter-spacing: .18em;

      text-transform: uppercase;

    }



    /* TÍTULO */

    .modal-title {

      margin: 0 0 16px;

      max-width: 410px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(31px, 4vw, 43px);

      line-height: 1.05;

      font-weight: 400;

      letter-spacing: -.025em;

    }



    .modal-intro {

      margin: 0 0 34px;

      max-width: 390px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 16px;

      line-height: 1.55;

      color: #625b52;

    }



    /* ==================================================
       CAMPOS
    ================================================== */

    .field {

      margin-bottom: 24px;

    }


    .field label {

      display: block;

      margin-bottom: 8px;

      font-size: 9px;

      letter-spacing: .17em;

      text-transform: uppercase;

      color: #766e64;

    }


    .field input {

      width: 100%;

      padding: 8px 0 10px;

      border: 0;

      border-bottom:
        1px solid rgba(40, 36, 31, .30);

      border-radius: 0;

      outline: none;

      background: transparent;

      color: #28241f;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 17px;

      transition:
        border-color .18s ease;

    }


    .field input:focus {

      border-bottom-color: #28241f;

    }



    .contact-hint {

      margin:
        -9px
        0
        25px;

      font-size: 10px;

      line-height: 1.45;

      color: #81786d;

    }



    /* ==================================================
       BOTONES MODAL
    ================================================== */

    .modal-button {

      display: inline-block;

      margin-top: 8px;

      padding:
        11px
        0
        7px;

      border: 0;

      border-bottom:
        1.5px solid #28241f;

      background: transparent;

      color: #28241f;

      font-size: 10px;

      letter-spacing: .19em;

      text-transform: uppercase;

      cursor: pointer;

      transition: opacity .18s ease;

    }


    .modal-button:hover {

      opacity: .55;

    }



    /* ==================================================
       MENSAJE DE GRACIAS
    ================================================== */

    .success {

      display: none;

      padding:
        8px
        0
        3px;

    }


    .success.is-visible {

      display: block;

    }


    .success-title {

      margin:
        0
        0
        15px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 42px;

      line-height: 1;

      font-weight: 400;

    }


    .success-text {

      margin:
        0
        0
        30px;

      max-width: 360px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 16px;

      line-height: 1.55;

      color: #625b52;

    }


    .is-hidden {

      display: none !important;

    }



    /* iframe invisible para enviar sin salir de la web */

    iframe[name="submitFrame"] {

      display: none;

    }



    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 600px) {

      .subscribe-dialog {

        width:
          calc(100vw - 28px);

      }


      .modal-inner {

        padding:
          44px
          28px
          36px;

      }


      .modal-title {

        font-size: 34px;

      }

    }


  </style>

</head>



<body>


  <!-- ==================================================
       HOME
  ================================================== -->

  <main class="hero">


    <svg

      class="hero-svg"

      viewBox="0 0 1670 941"

      preserveAspectRatio="xMidYMid slice"

      xmlns="http://www.w3.org/2000/svg"

      xmlns:xlink="http://www.w3.org/1999/xlink"

      aria-label="Clara Ortiz"

    >



      <!-- =================================================
           IMAGEN
      ================================================== -->

      <image

        href="./home.jpg"

        xlink:href="./home.jpg"

        x="0"
        y="0"

        width="1670"
        height="941"

        preserveAspectRatio="none"

      />



      <!-- =================================================
           SUSCRIBIRME
      ================================================== -->

      <a

        id="openSubscribe"

        class="subscribe-link"

        href="#suscribirme"

        aria-label="Suscribirme"

      >


        <!-- Zona clickeable -->

        <rect

          class="hit"

          x="172"
          y="414"

          width="256"
          height="74"

          rx="37"

        />



        <!-- Borde negro -->

        <rect

          class="subscribe-border"

          x="181.5"
          y="424.5"

          width="237"
          height="53"

          rx="26.5"

        />



        <!-- Foco teclado -->

        <rect

          class="focus-outline"

          x="178"
          y="421"

          width="244"
          height="60"

          rx="30"

        />


      </a>



      <!-- =================================================
           CONCEPTO
      ================================================== -->

      <a

        class="menu-link"

        href="#concepto"

        aria-label="Concepto"

      >


        <rect

          class="hit"

          x="1174"
          y="35"

          width="126"
          height="47"

          rx="4"

        />


        <line

          class="menu-underline"

          x1="1187"
          y1="68"

          x2="1286"
          y2="68"

        />


        <rect

          class="focus-outline"

          x="1180"
          y="43"

          width="113"
          height="26"

          rx="3"

        />


      </a>



      <!-- =================================================
           ESTÉTICA
      ================================================== -->

      <a

        class="menu-link"

        href="#estetica"

        aria-label="Estética"

      >


        <rect

          class="hit"

          x="1330"
          y="35"

          width="112"
          height="47"

          rx="4"

        />


        <line

          class="menu-underline"

          x1="1343"
          y1="68"

          x2="1428"
          y2="68"

        />


        <rect

          class="focus-outline"

          x="1336"
          y="43"

          width="99"
          height="26"

          rx="3"

        />


      </a>



      <!-- =================================================
           CONTACTO
      ================================================== -->

      <a

        class="menu-link"

        href="contacto.html"

        aria-label="Contacto"

      >


        <rect

          class="hit"

          x="1472"
          y="35"

          width="126"
          height="47"

          rx="4"

        />


        <line

          class="menu-underline"

          x1="1485"
          y1="68"

          x2="1584"
          y2="68"

        />


        <rect

          class="focus-outline"

          x="1478"
          y="43"

          width="113"
          height="26"

          rx="3"

        />


      </a>


    </svg>


  </main>




  <!-- ==================================================
       MODAL SUSCRIBIRME
  ================================================== -->

  <dialog

    id="subscribeDialog"

    class="subscribe-dialog"

  >


    <div class="modal-inner">


      <!-- CERRAR X -->

      <button

        id="closeSubscribeX"

        class="modal-close-x"

        type="button"

        aria-label="Cerrar"

      >

        ×

      </button>



      <!-- ENCABEZADO -->

      <div

        id="modalHeading"

        class="modal-heading"

      >


        <div class="modal-brand">

          Clara Ortiz

        </div>


        <h2 class="modal-title">

          ¿Cómo nos comunicamos contigo?

        </h2>


        <p class="modal-intro">

          Dejanos tus datos y te contamos lo que se viene.

        </p>


      </div>



      <!-- ==================================================
           FORMULARIO
      ================================================== -->

      <form

        id="subscribeForm"

        action="https://formsubmit.co/fabiofuentes@gmail.com"

        method="POST"

        target="submitFrame"

      >



        <!-- ASUNTO MAIL -->

        <input

          type="hidden"

          name="_subject"

          value="Nueva suscripción — Clara Ortiz"

        >



        <!-- Sin captcha -->

        <input

          type="hidden"

          name="_captcha"

          value="false"

        >



        <!-- Presentación del mail -->

        <input

          type="hidden"

          name="_template"

          value="table"

        >



        <!-- NOMBRE -->

        <div class="field">

          <label for="nombre">

            Nombre

          </label>


          <input

            id="nombre"

            name="Nombre"

            type="text"

            autocomplete="name"

            required

          >

        </div>



        <!-- WHATSAPP -->

        <div class="field">

          <label for="whatsapp">

            WhatsApp

          </label>


          <input

            id="whatsapp"

            name="WhatsApp"

            type="tel"

            autocomplete="tel"

          >

        </div>



        <!-- MAIL -->

        <div class="field">

          <label for="mail">

            Mail

          </label>


          <input

            id="mail"

            name="Mail"

            type="email"

            autocomplete="email"

          >

        </div>



        <p class="contact-hint">

          Dejanos al menos un WhatsApp o un mail.

        </p>



        <button

          class="modal-button"

          type="submit"

        >

          Enviar

        </button>


      </form>



      <!-- ==================================================
           GRACIAS
      ================================================== -->

      <div

        id="successMessage"

        class="success"

        aria-live="polite"

      >


        <h3 class="success-title">

          Gracias.

        </h3>


        <p class="success-text">

          Ya tenemos tus datos. Muy pronto vas a saber de nosotros.

        </p>


        <button

          id="closeSuccess"

          class="modal-button"

          type="button"

        >

          Cerrar

        </button>


      </div>


    </div>


  </dialog>




  <!--
       FormSubmit carga la respuesta acá.
       El visitante NO abandona Clara Ortiz.
  -->

  <iframe

    name="submitFrame"

    title="Envío de formulario"

  ></iframe>




  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->

  <script>


    const dialog =
      document.getElementById("subscribeDialog");


    const openSubscribe =
      document.getElementById("openSubscribe");


    const closeSubscribeX =
      document.getElementById("closeSubscribeX");


    const closeSuccess =
      document.getElementById("closeSuccess");


    const form =
      document.getElementById("subscribeForm");


    const modalHeading =
      document.getElementById("modalHeading");


    const successMessage =
      document.getElementById("successMessage");


    const nombre =
      document.getElementById("nombre");


    const whatsapp =
      document.getElementById("whatsapp");


    const mail =
      document.getElementById("mail");



    /* ==================================================
       RESETEAR MODAL
    ================================================== */

    function resetModal() {


      form.reset();


      mail.setCustomValidity("");


      modalHeading.classList.remove(
        "is-hidden"
      );


      form.classList.remove(
        "is-hidden"
      );


      successMessage.classList.remove(
        "is-visible"
      );


    }



    /* ==================================================
       ABRIR
    ================================================== */

    function showSubscribeModal() {


      resetModal();


      if (!dialog.open) {

        dialog.showModal();

      }


      setTimeout(() => {

        nombre.focus();

      }, 50);


    }



    /* ==================================================
       CERRAR
    ================================================== */

    function closeSubscribeModal() {


      if (dialog.open) {

        dialog.close();

      }


    }



    /* ==================================================
       CLICK SUSCRIBIRME
    ================================================== */

    openSubscribe.addEventListener(

      "click",

      function(event) {


        event.preventDefault();


        showSubscribeModal();


      }

    );



    /* ==================================================
       BOTONES CERRAR
    ================================================== */

    closeSubscribeX.addEventListener(

      "click",

      closeSubscribeModal

    );


    closeSuccess.addEventListener(

      "click",

      closeSubscribeModal

    );



    /* ==================================================
       CLICK FUERA DEL MODAL
    ================================================== */

    dialog.addEventListener(

      "click",

      function(event) {


        const rect =
          dialog.getBoundingClientRect();


        const clickInside =

          event.clientX >= rect.left &&

          event.clientX <= rect.right &&

          event.clientY >= rect.top &&

          event.clientY <= rect.bottom;


        if (!clickInside) {

          closeSubscribeModal();

        }


      }

    );



    /* ==================================================
       VALIDACIÓN

       Debe existir:
       WhatsApp
       O Mail.
    ================================================== */

    function validateContact() {


      const hasWhatsapp =

        whatsapp.value.trim() !== "";


      const hasMail =

        mail.value.trim() !== "";



      if (!hasWhatsapp && !hasMail) {


        mail.setCustomValidity(

          "Ingresá un WhatsApp o un mail."

        );


        mail.reportValidity();


        return false;


      }


      mail.setCustomValidity("");


      return true;


    }



    whatsapp.addEventListener(

      "input",

      function() {


        if (

          whatsapp.value.trim() !== ""

        ) {


          mail.setCustomValidity("");


        }


      }

    );



    mail.addEventListener(

      "input",

      function() {


        mail.setCustomValidity("");


      }

    );



    /* ==================================================
       ENVIAR
    ================================================== */

    form.addEventListener(

      "submit",

      function(event) {


        event.preventDefault();



        /* Validación HTML */

        if (!form.checkValidity()) {


          form.reportValidity();


          return;


        }



        /* WhatsApp o Mail */

        if (!validateContact()) {


          return;


        }



        /*
          Envía realmente los datos
          a FormSubmit.

          Como target es submitFrame,
          la web permanece donde está.
        */

        form.submit();



        /*
          Mostrar agradecimiento
          inmediatamente.
        */

        modalHeading.classList.add(
          "is-hidden"
        );


        form.classList.add(
          "is-hidden"
        );


        successMessage.classList.add(
          "is-visible"
        );


      }

    );



    /* ==================================================
       ABRIR DESDE OTRA PÁGINA

       Esto hace funcionar:

       index.html#suscribirme

       por ejemplo desde contacto.html
    ================================================== */

    if (

      window.location.hash ===
      "#suscribirme"

    ) {


      window.addEventListener(

        "load",

        function() {


          showSubscribeModal();



          /*
            Quitamos #suscribirme después
            para que la URL quede limpia.
          */

          history.replaceState(

            null,

            "",

            window.location.pathname +
            window.location.search

          );


        }

      );


    }


  </script>


</body>

</html>
