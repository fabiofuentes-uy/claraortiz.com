<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CLARA ORTIZ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #eee8e1;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .landing {
      position: relative;
      width: 100%;
      aspect-ratio: 1664 / 936;
      overflow: hidden;
      background: #eee8e1;
    }

    .landing img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /*
      ÁREAS CLICKEABLES
    */

    .hotspot {
      position: absolute;
      display: block;
      text-decoration: none;
      cursor: pointer;
      z-index: 10;
    }

    /*
      MENÚ SUPERIOR
    */

    .nav-link::after {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: -2px;
      height: 1px;

      background: rgba(96, 67, 43, 0.9);

      transform: scaleX(0);
      transform-origin: center;

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    .nav-link:hover::after {
      transform: scaleX(1);
    }

    .nav-link:hover {
      filter: brightness(0.88);
    }

    /*
      BOTÓN SUSCRIBIRME
    */

    .subscribe {
      border-radius: 40px;

      transition:
        background 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;
    }

    .subscribe:hover {
      background: rgba(255,255,255,0.10);

      box-shadow:
        0 5px 18px rgba(72, 49, 31, 0.22),
        inset 0 0 0 1px rgba(255,255,255,0.20);

      transform: translateY(-2px);
    }


    /*
      POSICIONES
      calculadas sobre la imagen original 1664 × 936
    */

    .subscribe {
      left: 10.65%;
      top: 44.55%;
      width: 14.35%;
      height: 5.85%;
    }

    .concepto {
      left: 69.6%;
      top: 3.65%;
      width: 7.3%;
      height: 4.4%;
    }

    .estetica {
      left: 78.25%;
      top: 3.65%;
      width: 7%;
      height: 4.4%;
    }

    .contacto {
      left: 87%;
      top: 3.65%;
      width: 7.6%;
      height: 4.4%;
    }


    /*
      FOCO DE TECLADO
    */

    .hotspot:focus-visible {
      outline: 2px solid rgba(117, 82, 52, 0.75);
      outline-offset: 3px;
    }


    /*
      MOBILE
    */

    @media (max-width: 700px) {

      body {
        background: #f1ebe5;
      }

      .landing {
        min-width: 100%;
      }

      .nav-link::after {
        height: 1px;
      }

    }
  </style>
</head>


<body>

  <main class="landing">

    <img
      src="home.jpg"
      alt="CLARA ORTIZ"
    >


    <!-- SUSCRIBIRME -->
    <a
      class="hotspot subscribe"
      href="#suscribirme"
      aria-label="Suscribirme"
    ></a>


    <!-- CONCEPTO -->
    <a
      class="hotspot nav-link concepto"
      href="#concepto"
      aria-label="Concepto"
    ></a>


    <!-- ESTÉTICA -->
    <a
      class="hotspot nav-link estetica"
      href="#estetica"
      aria-label="Estética"
    ></a>


    <!-- CONTACTO -->
    <a
      class="hotspot nav-link contacto"
      href="#contacto"
      aria-label="Contacto"
    ></a>

  </main>

</body>
</html>
